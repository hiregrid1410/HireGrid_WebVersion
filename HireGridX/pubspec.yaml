name: hiregridx
description: "HireGridX Student Mobile App - Pixel-perfect UI/UX"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.3
  confetti: ^0.7.0
  flutter_svg: ^2.0.10+1

  # Network & Real Backend Dependencies
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^10.1.2
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
