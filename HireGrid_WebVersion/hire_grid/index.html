<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireGrid</title>
    <style>
      /* Immediate dark application background to prevent white/black flashing before JS bundles execute */
      html, body {
        background-color: #070D19;
        color: #F8FAFC;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      .pre-boot-shell {
        position: fixed;
        inset: 0;
        background-color: #070D19;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .pre-boot-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(16, 185, 129, 0.15);
        border-top-color: #10B981;
        border-radius: 50%;
        animation: preboot-spin 1s linear infinite;
      }
      @keyframes preboot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-boot-shell">
        <div class="pre-boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
